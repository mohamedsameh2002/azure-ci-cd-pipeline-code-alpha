<!DOCTYPE html>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
        background:
            radial-gradient(circle at top left, #2563eb, transparent 35%),
            radial-gradient(circle at bottom right, #7c3aed, transparent 35%),
            #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        position: relative;
    }

    .running {
        position: absolute;
        top: 35px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #86efac;
    }

    .container {
        width: 100%;
        max-width: 850px;
        padding: 60px 40px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 25px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(15px);
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }

    .badge {
        display: inline-block;
        padding: 8px 18px;
        margin-bottom: 25px;
        border-radius: 50px;
        background: rgba(59,130,246,0.2);
        border: 1px solid rgba(96,165,250,0.4);
        color: #93c5fd;
        font-size: 14px;
    }

    h1 {
        font-size: 52px;
        margin-bottom: 18px;
        background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    p {
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.7;
        margin-bottom: 35px;
    }

    .tech {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    .tech span {
        padding: 10px 18px;
        border-radius: 12px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.12);
        color: #e2e8f0;
        font-size: 14px;
    }

    .status {
        margin-top: 35px;
        color: #86efac;
        font-size: 15px;
    }
</style>
```

</head>

<body>

```
<div class="running">PROJECT IS RUNNING NOW from mohamed</div>

<div class="container">

    <div class="badge">DEVOPS • CI/CD</div>

    <h1>Azure CI/CD Pipeline</h1>

    <p>
        A containerized web application deployed automatically
        using Azure DevOps, Docker, Azure Container Registry,
        and Azure App Service.
    </p>

    <div class="tech">
        <span>Docker</span>
        <span>Azure Pipelines</span>
        <span>ACR</span>
        <span>App Service</span>
        <span>Terraform</span>
    </div>

    <div class="status">
        ● Deployment Ready
    </div>

</div>
```

</body>
</html>
