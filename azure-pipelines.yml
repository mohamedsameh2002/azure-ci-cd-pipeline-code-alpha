
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "azure-cicd-connection"

  ACR_LOGIN_SERVER: "mohamedazurecicd2026.azurecr.io"
  ACR_NAME: "mohamedazurecicd2026"

  imageRepository: "web-app"
  imageTag: "$(Build.BuildId)"

  appName: "webapp-azure-cicd"
  resourceGroupName: "rg-azure-cicd"

stages:

  - stage: Build
    displayName: Build and Push Docker Image

    jobs:
      - job: Build
        displayName: Build Docker Image

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Login to Azure and Push Image to ACR
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(ACR_NAME)

                docker build \
                  -t $(ACR_LOGIN_SERVER)/$(imageRepository):latest \
                  -t $(ACR_LOGIN_SERVER)/$(imageRepository):$(imageTag) \
                  -f $(Build.SourcesDirectory)/app/Dockerfile \
                  $(Build.SourcesDirectory)/app

                docker push $(ACR_LOGIN_SERVER)/$(imageRepository):latest
                docker push $(ACR_LOGIN_SERVER)/$(imageRepository):$(imageTag)

  - stage: Deploy
    displayName: Deploy to Azure App Service

    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: Deploy Container

        steps:
          - task: AzureCLI@2
            displayName: Deploy Container to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp config container set \
                  --name "$(appName)" \
                  --resource-group "$(resourceGroupName)" \
                  --container-image-name "$(ACR_LOGIN_SERVER)/$(imageRepository):$(imageTag)"
