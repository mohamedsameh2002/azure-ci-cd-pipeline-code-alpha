trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: "acr-cicd-connection"
  azureServiceConnection: "azure-cicd-connection"

  ACR_LOGIN_SERVER: "azurecicdregistry.azurecr.io"

  imageRepository: "web-app"
  dockerfilePath: "$(Build.SourcesDirectory)/app/Dockerfile"
  imageTag: "$(Build.BuildId)"

  appName: "webapp-azure-cicd"
  resourceGroupName: "rg-azure-cicd"

stages:
  - stage: Build
    displayName: Build and Push Docker Image

    jobs:
      - job: Build
        displayName: Build Docker Image

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and Push Image to ACR
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: "$(Build.SourcesDirectory)/app"
              tags: |
                latest
                $(imageTag)

  - stage: Deploy
    displayName: Deploy to Azure App Service

    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: Deploy Container

        steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy Container to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(appName)
              containers: "$(ACR_LOGIN_SERVER)/$(imageRepository):latest"
